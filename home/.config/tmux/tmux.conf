set -g default-terminal "tmux-256color"
set -g extended-keys always
set -g history-limit 5000
set -g mouse on
set -g escape-time 0
set -g focus-events on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g status-position bottom
set -g status-interval 1
set -g status-left ""
set -g status-right ""
set -g status-style "bg=#121216,fg=#4f5071"
set -g message-style "bg=#e5dca4,fg=#121216"
set -g pane-border-style "fg=#4f5071"
set -g pane-active-border-style "fg=#87bff7"
set -g window-status-separator ""
set -g window-status-format " #I  #W "
set -g window-status-current-format " #I  #W "
set -g window-status-style "bg=#121216,fg=#4f5071"
set -g window-status-current-style "bg=#d4d7ff,fg=#121216"
setw -g mode-keys vi

bind-key t new-window
bind-key w confirm-before -p "Close window #W? (y/n)" kill-window
bind-key L last-window
bind-key -n C-t new-window
bind-key -n S-Enter send-keys -l "\e[13;2u"
bind-key -n C-S-Left previous-window
bind-key -n C-S-Right next-window
bind-key | split-window -h
bind-key - split-window -v
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key z resize-pane -Z

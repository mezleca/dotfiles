[window]
padding = { x = 10, y = 0 }

[scrolling]
history = 5000
multiplier = 8

[font]
normal = { family = "CommitMono Nerd Font", style = "Regular" }
bold = { family = "CommitMono Nerd Font", style = "Bold" }
italic = { family = "CommitMono Nerd Font", style = "Italic" }
bold_italic = { family = "CommitMono Nerd Font", style = "Bold Italic" }
size = 12.5
builtin_box_drawing = false

[cursor]
style = { shape = "Underline", blinking = "Always" }
blink_interval = 1000
blink_timeout = 0
thickness = 0.2

[colors.primary]
foreground = "#d4d7ff"
background = "#121216"
dim_foreground = "#d4d7ff"

[colors.cursor]
text = "#121216"
cursor = "#d4d7ff"

[colors.selection]
text = "#1c1c1c"
background = "#5c5c5c"

[colors.normal]
black = "#12121f"
red = "#bd4277"
green = "#74d2b7"
yellow = "#e5dca4"
blue = "#87bff7"
magenta = "#9486e4"
cyan = "#9be9f8"
white = "#d4d7ff"

[colors.bright]
black = "#4f5071"
red = "#bf4a7f"
green = "#7ed7c0"
yellow = "#ecdfac"
blue = "#8fc8fa"
magenta = "#9f95e9"
cyan = "#aaecf8"
white = "#cccfff"

[colors.dim]
black = "#12121f"
red = "#bd4277"
green = "#74d2b7"
yellow = "#e5dca4"
blue = "#87bff7"
magenta = "#9486e4"
cyan = "#9be9f8"
white = "#d4d7ff"

[terminal]
shell = { program = "/usr/bin/tmux", args = ["new-session", "-A", "-s", "main"] }

[keyboard]
bindings = [
  { key = "F11", mods = "Control|Shift", action = "ToggleFullscreen" },
  { key = "Return", mods = "Shift", chars = "\u001b[13;2u" },
  { key = "Q", mods = "Control|Shift", chars = "\u0002w" },
]
